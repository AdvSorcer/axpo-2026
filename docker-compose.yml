services:
  # ElysiaJS + Bun + SQLite Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axpo-backend
    restart: always
    ports:
      - "3005:3005"
    environment:
      - JWT_SECRET=axpo-production-super-secret-key-2026
      - PORT=3005
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/uploads
    networks:
      - axpo-network

  # Vue 3 + Naive UI + Nginx Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: axpo-frontend
    restart: always
    ports:
      - "3004:80"
    depends_on:
      - backend
    networks:
      - axpo-network

volumes:
  sqlite_data:
  uploads_data:

networks:
  axpo-network:
    driver: bridge
